name: build Release
on: [push]

jobs:
  build:
    name: build Release
    runs-on: windows-latest
    permissions:
      contents: write # Required for creating releases and pushing tags
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: c-cpp
            build-mode: manual
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      # Initializes the CodeQL tools for scanning.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Install third party libraries
        run: ./InstallThirdPartyLibraries.ps1

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build solution
        run: msbuild /m CppCoverage.sln /t:OpenCppCoverage  /p:Configuration=Release /p:Platform=x64

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{matrix.language}}"

      - name: release package
        shell: pwsh
        run: |
          # Configure git to use the GitHub token for authentication
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@github.com"

          $version = Get-Content .\VERSION.txt
          $commitId = git rev-list --no-merges -n 1 HEAD
          $tagName = "v$version"

          # Check if tag already exists
          $existingTag = git tag -l $tagName
          if (-not $existingTag) {
            git tag $tagName $commitId
            git push origin $tagName
            
            # Create GitHub release
            gh release create $tagName .\x64\Release\OpenCppCoverage.exe --title "OpenCppCoverage $version" --notes "Release $version"
          } else {
            Write-Host "Tag $tagName already exists, skipping release creation"
          }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
